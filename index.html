<!DOCTYPE html>
<html lang="en" class="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#0a0a0a">
	<title>Simon Says</title>
	<meta name="description" content="A refined Web Audio memory game where players repeat an increasingly complex sequence of neon color frequencies.">
	
	<!-- Fonts matching chaddytwiceover.com -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="game-wrapper" id="main-content">
		<div class="game-card" aria-label="Game board and controls">
			
			<!-- HUD / Performance Metrics -->
			<div class="hud-panel" aria-label="Game statistics">
				<div class="metric-card">
					<span class="metric-label">SCORE</span>
					<span class="metric-value" id="score-val">0</span>
				</div>
				<div class="metric-card">
					<span class="metric-label">BEST</span>
					<span class="metric-value" id="best-val">0</span>
				</div>
				<div class="metric-card">
					<span class="metric-label">STAGE</span>
					<span class="metric-value" id="seq-val">0</span>
				</div>
				<div class="metric-card">
					<span class="metric-label">REACTION</span>
					<span class="metric-value" id="reaction-val">--</span>
				</div>
			</div>

			<!-- Secondary Control Row: State, Difficulty, Audio -->
			<div class="controls-row">
				<div id="state-display" class="state-pill state-idle">
					<span class="status-dot"></span>
					<span id="state-text">IDLE</span>
				</div>

				<div class="difficulty-selector" role="radiogroup" aria-label="Select difficulty">
					<button type="button" class="diff-btn" data-difficulty="easy">Easy</button>
					<button type="button" class="diff-btn active" data-difficulty="medium">Medium</button>
					<button type="button" class="diff-btn" data-difficulty="hard">Hard</button>
				</div>

				<button type="button" id="sound-btn" class="icon-btn" aria-label="Toggle sound" title="Toggle audio synthesizer">
					<!-- Volume Up Icon -->
					<svg id="sound-icon-on" class="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
						<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
						<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
					</svg>
					<!-- Volume Mute Icon -->
					<svg id="sound-icon-off" class="sound-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
						<line x1="23" y1="9" x2="17" y2="15"></line>
						<line x1="17" y1="9" x2="23" y2="15"></line>
					</svg>
				</button>
			</div>

			<!-- Tactile Simon Pad Matrix -->
			<div class="board-wrapper">
				<div class="game-board" id="game-board">
					<button type="button" class="color-pad pad-green" id="green" aria-label="Green pad (E4 tone)"></button>
					<button type="button" class="color-pad pad-red" id="red" aria-label="Red pad (C4 tone)"></button>
					<button type="button" class="color-pad pad-yellow" id="yellow" aria-label="Yellow pad (G4 tone)"></button>
					<button type="button" class="color-pad pad-blue" id="blue" aria-label="Blue pad (C5 tone)"></button>
					<div class="board-hub">
						<span class="hub-label">SIMON</span>
					</div>
				</div>
			</div>

			<!-- Message Prompter -->
			<div id="message" class="game-message" aria-live="polite">Press Start Game to begin sequence</div>

			<!-- Primary Action Button -->
			<div class="action-row">
				<button type="button" id="start-btn" class="start-btn">Start Game</button>
			</div>

		</div>
	</main>

	<!-- Legacy hidden elements for backward compatibility if queried -->
	<div style="display:none;" id="score">Score: 0 | Best: 0 | Seq: 0</div>
	<div style="display:none;" id="performance-display">AVG REACTION: --</div>
	<div style="display:none;" id="difficulty-display">DIFFICULTY: MEDIUM</div>

	<script src="script.js"></script>
</body>
</html>
